<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción a Actividad Extraescolar ♡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #49345b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;

      /* IMAGEN DE FONDO PRINCIPAL */
      background-image: url("fondo.jpg"); /* Ruta corregida */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    /* CUADRO / TARJETA MÁS TRANSPARENTE */
    .form-container {
      max-width: 520px;
      width: 100%;
      margin: auto;
      padding: 35px;
      background: rgba(255, 250, 255, 0.70); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    h2 {
      text-align: center;
      color: #8655a1;
      font-family: Georgia, serif;
      font-size: 26px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    label.titulo-label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #5d3472;
      font-size: 0.95rem;
    }

    /* Estilos para las Tarjetas de Actividades */
    .actividades-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 5px;
    }

    .card-radio {
      display: none;
    }

    .actividad-card {
      background: rgba(248, 239, 252, 0.85);
      border: 2px solid #e5cbe9;
      border-radius: 18px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .actividad-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .actividad-card span {
      font-weight: bold;
      font-size: 0.85rem;
      color: #5d3472;
      margin-bottom: 8px;
    }

    .btn-seleccionar {
      background: #edc9f6;
      color: #452453;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .actividad-card:hover {
      transform: translateY(-3px);
      border-color: #b45f9c;
    }

    /* EFECTO CUANDO SE SELECCIONA LA TARJETA */
    .card-radio:checked + .actividad-card {
      background: rgba(237, 201, 246, 0.95);
      border-color: #8655a1;
      box-shadow: 0 4px 12px rgba(134, 85, 161, 0.3);
    }

    .card-radio:checked + .actividad-card .btn-seleccionar {
      background: #8655a1;
      color: #ffffff;
    }

    /* Campos de texto y select con ligera transparencia */
    input[type="text"],
    input[type="number"],
    select {
      padding: 12px 15px;
      border: 1px solid #e5cbe9;
      border-radius: 15px;
      font-size: 1rem;
      background-color: rgba(255, 255, 255, 0.85);
      color: #49345b;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #b45f9c;
      background-color: #ffffff;
      outline: none;
      box-shadow: 0 0 8px rgba(180, 95, 156, 0.3);
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 5px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      cursor: pointer;
      color: #49345b;
    }

    input[type="submit"] {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 25px;
      background: #edc9f6;
      color: #452453;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(105, 50, 130, 0.2);
      transition: 0.3s;
      margin-top: 15px;
    }

    input[type="submit"]:hover {
      background: #f8d8e9;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .actividades-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Inscripción Extraescolar ♡</h2>
    
    <form action="#" method="POST">
      
      <!-- Campo 1: Texto -->
      <div class="form-group">
        <label class="titulo-label" for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre..." required>
      </div>

      <!-- TARJETAS CON IMÁGENES -->
      <div class="form-group">
        <label class="titulo-label">Selecciona tu Actividad:</label>
        <div class="actividades-grid">
          
          <!-- Tarjeta 1: Fútbol -->
          <label>
            <input type="radio" name="actividad" value="futbol" class="card-radio" required>
            <div class="actividad-card">
              <img src="futbol.jpg" alt="Fútbol">
              <span>Fútbol</span>
              <div class="btn-seleccionar">Elegir</div>
            </div>
          </label>

          <!-- Tarjeta 2: Banda de Guerra -->
          <label>
            <input type="radio" name="actividad" value="banda" class="card-radio">
            <div class="actividad-card">
              <img src="tambores.jpg" alt="Banda de Guerra">
              <span>Banda de Guerra</span>
              <div class="btn-seleccionar">Elegir</div>
            </div>
          </label>

          <!-- Tarjeta 3: Ajedrez -->
          <label>
            <input type="radio" name="actividad" value="ajedrez" class="card-radio">
            <div class="actividad-card">
              <img src="ajedrez.jpg" alt="Ajedrez">
              <span>Ajedrez</span>
              <div class="btn-seleccionar">Elegir</div>
            </div>
          </label>

        </div>
      </div>

      <!-- Campo 2: Solo números (Mínimo 15 años) -->
      <div class="form-group">
        <label class="titulo-label" for="edad">Edad (Solo números):</label>
        <input type="number" id="edad" name="edad" min="15" placeholder="Ej. 16" required>
      </div>

      <!-- Campo 3: Botones de opción (Radio para Semestre) -->
      <div class="form-group">
        <label class="titulo-label">Semestre:</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="semestre" value="2do" required> 2do
          </label>
          <label class="radio-option">
            <input type="radio" name="semestre" value="4to"> 4to
          </label>
          <label class="radio-option">
            <input type="radio" name="semestre" value="6to"> 6to
          </label>
        </div>
      </div>

      <!-- Campo 4: Lista desplegable (Select) -->
      <div class="form-group">
        <label class="titulo-label" for="turno">Turno:</label>
        <select id="turno" name="turno" required>
          <option value="" disabled selected>-- Selecciona el turno --</option>
          <option value="matutino">Matutino</option>
          <option value="vespertino">Vespertino</option>
        </select>
      </div>

      <!-- Campo 5: Botón de envío -->
      <input type="submit" value="Inscribirme ✨">

    </form>
  </div>

</body>
</html>
